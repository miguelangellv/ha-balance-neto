name: Create Release PR

on:
  workflow_dispatch:

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load project variables
        run: sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' .github/project.env >> "$GITHUB_ENV"

      - name: Get last published version
        id: last_version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "Last published version: ${LAST_TAG:-none}"

      - name: Calculate new version
        id: new_version
        run: |
          # Esquema YY.MM.PATCH: año y mes actuales. Si ya existe una versión
          # (tag o rama de release) de este mismo mes, se incrementa el patch.
          YEAR_MONTH=$(date -u +%y.%m)
          echo "Base year/month: $YEAR_MONTH"

          # Se aceptan los prefijos v y V para no romper con versiones antiguas.
          EXISTING_REFS=$(
            git tag --list "[vV]${YEAR_MONTH}" "[vV]${YEAR_MONTH}.*"
            git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH_PREFIX}${YEAR_MONTH}.*" | sed 's#.*refs/heads/##'
          )
          echo "Existing refs for ${YEAR_MONTH}:"
          echo "${EXISTING_REFS:-  (none)}"

          PATCH=0
          while IFS= read -r REF; do
            [ -z "$REF" ] && continue

            VERSION="${REF#"$RELEASE_BRANCH_PREFIX"}"
            VERSION="${VERSION#[vV]}"
            VERSION_PATCH="${VERSION#"$YEAR_MONTH"}"
            VERSION_PATCH="${VERSION_PATCH#.}"

            # Una versión de dos componentes (YY.MM) cuenta como -1 para que
            # la primera versión completa del mes sea YY.MM.0.
            if ! [[ "$VERSION_PATCH" =~ ^[0-9]+$ ]]; then
              VERSION_PATCH=-1
            fi

            if [ "$VERSION_PATCH" -ge "$PATCH" ]; then
              PATCH=$((VERSION_PATCH + 1))
            fi
          done <<< "$EXISTING_REFS"

          NEW_VERSION="${YEAR_MONTH}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          LAST_TAG="${{ steps.last_version.outputs.tag }}"
          
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          else
            CHANGELOG=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Guardar changelog en archivo temporal
          echo "$CHANGELOG" > /tmp/changelog.txt
          
          echo "Changelog generated successfully"

      - name: Create release branch
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${RELEASE_BRANCH_PREFIX}${NEW_VERSION}"

      - name: Update manifest.json version
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          jq --arg version "$NEW_VERSION" '.version = $version' \
            "$MANIFEST_PATH" > /tmp/manifest.json
          mv /tmp/manifest.json "$MANIFEST_PATH"
          cat "$MANIFEST_PATH"

      - name: Update pyproject.toml version
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" "$PYPROJECT_PATH"
          grep "^version = " "$PYPROJECT_PATH"

      - name: Commit changes
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git add "$MANIFEST_PATH" "$PYPROJECT_PATH"
          git commit -m "chore: bump version to v$NEW_VERSION"
          git push origin "${RELEASE_BRANCH_PREFIX}${NEW_VERSION}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          LAST_TAG="${{ steps.last_version.outputs.tag }}"
          CURRENT_VERSION="${LAST_TAG:-ninguna}"
          
          # Leer changelog desde archivo
          CHANGELOG=$(cat /tmp/changelog.txt)
          
          # Crear descripción de la PR usando Here Document
          cat > /tmp/pr_body.md << 'EOFPR'
          ## 🚀 Release v%%NEW_VERSION%%
          
          **Esquema de versión**: `YY.MM.PATCH` (año.mes.patch)
          **Última versión publicada**: `%%CURRENT_VERSION%%`
          **Nueva versión**: `%%NEW_VERSION%%`

          La versión se calcula automáticamente con el año y mes actuales. Si ya
          existe una versión de este mismo mes, se incrementa el número de patch.
          
          ### 📋 Cambios incluidos
          
          %%CHANGELOG%%
          
          ---
          
          ### ✅ Checklist
          
          - [ ] Los cambios han sido revisados
          - [ ] La documentación está actualizada (si es necesario)
          - [ ] Los tests pasan correctamente
          
          ### 📝 Notas
          
          Esta PR fue creada automáticamente por el workflow de release.
          Al mergear esta PR, se creará automáticamente el tag y la release en GitHub.
          EOFPR
          
          # Reemplazar marcadores con valores reales usando múltiples sed
          sed -i "s/%%NEW_VERSION%%/$NEW_VERSION/g" /tmp/pr_body.md
          sed -i "s/%%CURRENT_VERSION%%/$CURRENT_VERSION/g" /tmp/pr_body.md
          
          # Insertar changelog línea por línea
          # Primero, crear archivo temporal con el changelog indentado
          echo "$CHANGELOG" > /tmp/changelog_temp.txt
          
          # Reemplazar el marcador de changelog con el contenido del archivo
          sed -i "/%%CHANGELOG%%/r /tmp/changelog_temp.txt" /tmp/pr_body.md
          sed -i "/%%CHANGELOG%%/d" /tmp/pr_body.md
          
          # Crear PR usando el archivo como cuerpo
          gh pr create \
            --title "v$NEW_VERSION" \
            --body-file /tmp/pr_body.md \
            --base "$MAIN_BRANCH" \
            --head "${RELEASE_BRANCH_PREFIX}${NEW_VERSION}" \
            --label "$RELEASE_LABEL"
          
          echo "✅ PR creada exitosamente para ${PROJECT_NAME} v$NEW_VERSION"

